name: Benchmarks

# Benchmarks are opt-in: a maintainer triggers this from the Actions tab
# via workflow_dispatch. Running them on every PR would burn minutes and
# produce noisy results (GitHub runners share CPU). The manual cadence
# also mirrors docs/benchmarks/baseline-*.md — baselines are refreshed
# deliberately, not automatically.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'BenchmarkDotNet filter (default: *)'
        required: false
        default: '*'
      job:
        description: 'BenchmarkDotNet Job (short | long | default)'
        required: false
        default: 'short'
        type: choice
        options:
          - short
          - default
          - long

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  benchmarks:
    name: Run Kun.Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore benchmarks/Kun.Benchmarks/Kun.Benchmarks.csproj

      - name: Build (Release)
        run: dotnet build benchmarks/Kun.Benchmarks/Kun.Benchmarks.csproj --configuration Release --no-restore

      - name: Run benchmarks
        # Program.cs already wires JsonExporter.Default + MarkdownExporter.GitHub
        # programmatically via ManualConfig, so we do not pass --exporters here.
        run: |
          cd benchmarks/Kun.Benchmarks
          dotnet run -c Release --no-build -- \
            --filter '${{ inputs.filter }}'

      - name: Upload BenchmarkDotNet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            benchmarks/Kun.Benchmarks/BenchmarkDotNet.Artifacts/**/*.json
            benchmarks/Kun.Benchmarks/BenchmarkDotNet.Artifacts/**/*.md
          if-no-files-found: error
          retention-days: 30
