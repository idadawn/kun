name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & Test
    runs-on: [self-hosted, qd]
    # No `services:` block — Testcontainers spins up its own containers on demand.
    # A GitHub-managed postgres/rabbitmq/redis service block wastes time and causes
    # port conflicts when Testcontainers also tries to bind the same ports.

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Unit tests only — fast, no external deps.
      # Kun.IntegrationTests: runs in a separate step below (Testcontainers).
      # Kun.Integration.AotTests: runs in the sample-aot-integration job
      #   so the matrix can install clang alongside dotnet publish.
      # Kun.Sample.Tests: excluded from CI because these tests require Aspire
      #   service-discovery env vars (services__catalog__*, etc.) that CI does
      #   not set. TODO: add a dedicated integration-compose job that wires the
      #   Aspire manifest so Sample.Tests can run in CI.
      - name: Unit Tests
        run: >
          dotnet test
          --configuration Release
          --no-build
          --verbosity minimal
          --collect:"XPlat Code Coverage"
          --filter "FullyQualifiedName!~Kun.IntegrationTests&FullyQualifiedName!~Kun.Sample.Tests&FullyQualifiedName!~Kun.Integration.AotTests"

      # Testcontainers integration tests — Docker is available on the qd runner.
      - name: Integration Tests (Testcontainers)
        run: >
          dotnet test tests/Kun.IntegrationTests
          --configuration Release
          --no-build
          --verbosity minimal

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage.cobertura.xml'

  # Full-module AOT audit — every IsAotCandidate=true project is fanned
  # out across a job matrix so a trim / AOT regression in one module
  # does not mask another, and the reported failure points directly
  # at the offending project. See
  # docs/architecture/AOT-audit-2026-04-23.md for the module-status
  # matrix. Intentionally-excluded non-AOT modules (AspNetCore, Dapper,
  # Saga, EntityFrameworkCore + its adapters) are not in this matrix
  # and stay covered by the Build & Test job.
  aot-audit:
    name: AOT Audit — ${{ matrix.module }}
    runs-on: [self-hosted, qd]
    strategy:
      fail-fast: false
      matrix:
        module:
          - Kun.Audit
          - Kun.Caching
          - Kun.Configuration
          - Kun.Core
          - Kun.EventBus
          - Kun.EventBus.RabbitMQ
          - Kun.Gateway
          - Kun.Grpc
          - Kun.Identity
          - Kun.Infrastructure
          - Kun.Mediator
          - Kun.MultiTenancy
          - Kun.Observability
          - Kun.RateLimit
          - Kun.Sandbox
          - Kun.Security
          - Kun.Storage
          - Kun.Validation

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install NativeAOT prerequisites
        # qd 机器基线已含 clang/zlib1g-dev；缺失时才回退 sudo apt（ubuntu-latest 两者俱全，通常也跳过）。
        # qd 无免密 sudo，无条件执行会让 job 挂在密码 prompt 上。
        run: |
          if ! command -v clang >/dev/null 2>&1 || [ ! -f /usr/include/zlib.h ]; then
            sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          fi

      - name: Publish AOT (zero trim / AOT warnings, warnings-as-errors)
        run: |
          dotnet publish "src/${{ matrix.module }}" \
            -c Release \
            -r linux-x64 \
            -p:PublishAot=true \
            -p:TreatWarningsAsErrors=true

  # Runs Kun.Integration.AotTests, which AOT-publishes
  # samples/Kun.Sample.Minimal and executes the produced native binary.
  # Requires clang + zlib1g-dev for the NativeAOT linker step. See
  # tests/Kun.Integration.AotTests/AGENTS.md.
  sample-aot-integration:
    name: Sample AOT Integration
    runs-on: [self-hosted, qd]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install NativeAOT prerequisites
        # qd 机器基线已含 clang/zlib1g-dev；缺失时才回退 sudo apt（ubuntu-latest 两者俱全，通常也跳过）。
        # qd 无免密 sudo，无条件执行会让 job 挂在密码 prompt 上。
        run: |
          if ! command -v clang >/dev/null 2>&1 || [ ! -f /usr/include/zlib.h ]; then
            sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          fi

      - name: Restore
        run: dotnet restore tests/Kun.Integration.AotTests/Kun.Integration.AotTests.csproj

      - name: Build
        run: >
          dotnet build tests/Kun.Integration.AotTests/Kun.Integration.AotTests.csproj
          --configuration Release
          --no-restore

      - name: Run AOT integration tests
        run: >
          dotnet test tests/Kun.Integration.AotTests/Kun.Integration.AotTests.csproj
          --configuration Release
          --no-build
          --verbosity minimal

  format:
    name: Code Format
    runs-on: [self-hosted, qd]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Verify format
        run: dotnet format --verify-no-changes --no-restore

  layering:
    name: Layering Check
    runs-on: [self-hosted, qd]

    steps:
      - uses: actions/checkout@v4

      - name: Kun.Core must have no third-party PackageReferences
        run: bash scripts/check-layering.sh
