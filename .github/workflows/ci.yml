name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    # No `services:` block — Testcontainers spins up its own containers on demand.
    # A GitHub-managed postgres/rabbitmq/redis service block wastes time and causes
    # port conflicts when Testcontainers also tries to bind the same ports.

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Unit tests only — fast, no external deps.
      # Kun.IntegrationTests: runs in a separate step below (Testcontainers).
      # Kun.Sample.Tests: excluded from CI because these tests require Aspire
      #   service-discovery env vars (services__catalog__*, etc.) that CI does
      #   not set. TODO: add a dedicated integration-compose job that wires the
      #   Aspire manifest so Sample.Tests can run in CI.
      - name: Unit Tests
        run: >
          dotnet test
          --configuration Release
          --no-build
          --verbosity minimal
          --collect:"XPlat Code Coverage"
          --filter "FullyQualifiedName!~Kun.IntegrationTests&FullyQualifiedName!~Kun.Sample.Tests"

      # Testcontainers integration tests — Docker is available on ubuntu-latest.
      - name: Integration Tests (Testcontainers)
        run: >
          dotnet test tests/Kun.IntegrationTests
          --configuration Release
          --no-build
          --verbosity minimal

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage.cobertura.xml'

  aot-publish:
    name: AOT Publish Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish AOT-candidate services (zero warnings)
        run: |
          # AOT candidates: any project with <IsAotCandidate>true</IsAotCandidate>
          # -r linux-x64 is required: native AOT compilation must know the target RID.
          # Kun.AspNetCore intentionally excluded: minimal-API generic helpers
          # (MapCommand<T,R> / MapQuery<T,R>) and WriteAsJsonAsync<T> in the
          # global exception handler are not AOT-compatible. Module is
          # trim-safe only (IsAotCandidate=false).
          # Kun.Storage.S3 intentionally excluded: AWSSDK.S3 + AWSSDK.Extensions.NETCore.Setup
          # are reflection-heavy and not AOT-safe (see open-questions.md A6 — the first
          # non-AOT library module in the repo). Kun.Storage.Abstractions and
          # Kun.Storage.Local remain AOT-zero-warning.
          for proj in src/Kun.Gateway src/Kun.Mediator src/Kun.Core src/Kun.Grpc src/Kun.Validation src/Kun.Storage.Abstractions src/Kun.Storage.Local; do
            echo "::group::Publishing AOT: $proj"
            dotnet publish "$proj" -c Release -r linux-x64 -p:PublishAot=true -p:TreatWarningsAsErrors=true
            echo "::endgroup::"
          done

  format:
    name: Code Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Verify format
        run: dotnet format --verify-no-changes --no-restore

  layering:
    name: Layering Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Kun.Core must have no third-party PackageReferences
        run: bash scripts/check-layering.sh
