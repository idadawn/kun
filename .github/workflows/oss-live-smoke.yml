name: OSS Live Smoke

# Runs the live Alibaba Cloud OSS smoke tests
# (tests/Kun.Storage.Oss.Tests/OssFileStorageLiveSmokeTests.cs) against a REAL
# bucket — the only way to verify OSS accepts the presigned PUT/GET signature,
# since no mock stands in for the OSS server (see PR #12).
#
# Kept out of the main CI workflow on purpose: it needs live credentials and
# would otherwise just skip on every push. Here it is opt-in:
#   - workflow_dispatch: run it by hand from the Actions tab whenever you want.
#   - schedule: a nightly run on the default branch for ongoing signature drift
#     detection.
#
# The four OSS_SMOKE_* repository secrets gate the actual work. When they are
# absent the tests self-skip (Assert.SkipUnless), so the job still goes green
# but verifies nothing — the "Check credentials" step prints a warning so a
# skipped run is not mistaken for a passing live verification.

on:
  workflow_dispatch:
  schedule:
    # Nightly at 03:27 UTC (off the top-of-hour scheduler congestion).
    - cron: '27 3 * * *'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  oss-live-smoke:
    name: OSS Live Smoke
    runs-on: [self-hosted, qd]
    # Scheduled runs only make sense on the canonical repo, never on forks
    # (which have no secrets and cannot reach the bucket anyway).
    if: github.repository == 'idadawn/kun'

    env:
      OSS_SMOKE_ENDPOINT: ${{ secrets.OSS_SMOKE_ENDPOINT }}
      OSS_SMOKE_BUCKET: ${{ secrets.OSS_SMOKE_BUCKET }}
      OSS_SMOKE_ACCESS_KEY_ID: ${{ secrets.OSS_SMOKE_ACCESS_KEY_ID }}
      OSS_SMOKE_ACCESS_KEY_SECRET: ${{ secrets.OSS_SMOKE_ACCESS_KEY_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check credentials
        # Probe ALL four secrets — the test's own guard skips unless every one is
        # non-empty (OssFileStorageLiveSmokeTests.ReadEnv), so a partial config
        # must not print the "running" message and pose as a real verification.
        run: |
          if [ -z "$OSS_SMOKE_ENDPOINT" ] || [ -z "$OSS_SMOKE_BUCKET" ] || \
             [ -z "$OSS_SMOKE_ACCESS_KEY_ID" ] || [ -z "$OSS_SMOKE_ACCESS_KEY_SECRET" ]; then
            echo "::warning::OSS_SMOKE_* secrets missing or incomplete — live smoke tests will SKIP, not verify. Set all of OSS_SMOKE_ENDPOINT / OSS_SMOKE_BUCKET / OSS_SMOKE_ACCESS_KEY_ID / OSS_SMOKE_ACCESS_KEY_SECRET to run them."
          else
            echo "OSS_SMOKE_* secrets present — running live smoke against the configured bucket."
          fi

      - name: Run OSS live smoke tests
        run: >
          dotnet test tests/Kun.Storage.Oss.Tests
          --configuration Release
          --verbosity minimal
          --filter "FullyQualifiedName~OssFileStorageLiveSmokeTests"
