name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: Build, Pack & Publish
    runs-on: [self-hosted, qd]
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # CalVer dates with NuGet-compatible hotfix labels (see CONTRIBUTING.md).
      #  - vYYYY.M.D / vYYYY.M.D-hotfix.N / vYYYY.M.D-beta.N → all cut from main
      # main is the only long-lived branch (develop deleted 2026-06-11);
      # legacy vX.Y.Z tags predate this policy, new ones are rejected.
      - name: Validate tag matches branch policy
        id: version
        run: |
          TAG="$GITHUB_REF_NAME"
          SHA="$GITHUB_SHA"
          BRANCHES=$(git branch -r --contains "$SHA" --format='%(refname:short)')
          python3 scripts/release_version.py --tag "$TAG" --github-output "$GITHUB_OUTPUT"
          if ! echo "$BRANCHES" | grep -qx 'origin/main'; then
            echo "::error::Tag $TAG must be cut from origin/main; commit $SHA is not reachable from main."
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore /warnaserror

      - name: Test (unit only — Docker suites run in CI workflow)
        run: |
          dotnet test -c Release --no-build \
            --filter "FullyQualifiedName!~IntegrationTests&FullyQualifiedName!~Sample.Tests" \
            --verbosity normal

      - name: Install NativeAOT prerequisites
        # ubuntu-latest 预装 clang；qd 机器基线已含 clang/zlib1g-dev。缺失时才回退
        # sudo apt——qd 无免密 sudo，无条件执行会让 job 挂在密码 prompt 上。
        run: |
          if ! command -v clang >/dev/null 2>&1 || [ ! -f /usr/include/zlib.h ]; then
            sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          fi

      - name: AOT publish verify
        run: |
          # AOT loop must exclude projects whose dependency closure is not AOT-safe:
          #  - Kun.Saga references Kun.EntityFrameworkCore (IsAotCandidate=false)
          #  - Kun.AspNetCore is IsAotCandidate=false (minimal-API generic helpers,
          #    see csproj comment). Mirrors ci.yml's aot-publish job.
          for proj in Kun.Core Kun.Mediator Kun.Validation Kun.EventBus.Abstractions Kun.EventBus Kun.EventBus.RabbitMQ Kun.Security Kun.Grpc Kun.Gateway; do
            if [ -d "src/$proj" ]; then
              echo "::group::AOT: $proj"
              dotnet publish "src/$proj" -c Release -r linux-x64 -p:PublishAot=true /warnaserror
              echo "::endgroup::"
            fi
          done

      - name: Pack
        run: |
          dotnet pack -c Release --no-build \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true \
            -o artifacts/

      - name: Validate package cohort before publishing
        run: python3 scripts/release_version.py --version "${{ steps.version.outputs.version }}" --artifacts artifacts

      - name: Push to NuGet.org
        if: steps.version.outputs.prerelease != 'true'
        run: |
          dotnet nuget push artifacts/*.nupkg \
            -k "${{ secrets.NUGET_API_KEY }}" \
            -s https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push artifacts/*.snupkg \
            -k "${{ secrets.NUGET_API_KEY }}" \
            -s https://api.nuget.org/v3/index.json \
            --skip-duplicate || true

      - name: Push to GitHub Packages
        run: |
          KUN_PUBLISH_NUGET_CONFIG=$(mktemp "$RUNNER_TEMP/kun-publish-nuget.XXXXXX")
          trap 'rm -f "$KUN_PUBLISH_NUGET_CONFIG"' EXIT
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$KUN_PUBLISH_NUGET_CONFIG"
          dotnet nuget add source \
            --configfile "$KUN_PUBLISH_NUGET_CONFIG" \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push artifacts/*.nupkg \
            --configfile "$KUN_PUBLISH_NUGET_CONFIG" \
            -k "${{ secrets.GITHUB_TOKEN }}" \
            -s "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kun ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
