name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: Build, Pack & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Policy (see CONTRIBUTING.md §Release & versioning), CalVer aligned
      # with idadawn/iclaw since 2026-06-11:
      #  - vYYYY.M.D / vYYYY.M.D-N / vYYYY.M.D-beta.N → all cut from main
      # main is the only long-lived branch (develop deleted 2026-06-11);
      # legacy vX.Y.Z tags predate this policy, new ones are rejected.
      - name: Validate tag matches branch policy
        run: |
          TAG="$GITHUB_REF_NAME"
          SHA="$GITHUB_SHA"
          BRANCHES=$(git branch -r --contains "$SHA" --format='%(refname:short)')
          if ! [[ "$TAG" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(-[0-9]+|-beta\.[0-9]+)?$ ]]; then
            echo "::error::Tag $TAG does not match CalVer policy vYYYY.M.D[-N|-beta.N] (see CONTRIBUTING.md)."
            exit 1
          fi
          if ! echo "$BRANCHES" | grep -qx 'origin/main'; then
            echo "::error::Tag $TAG must be cut from origin/main; commit $SHA is not reachable from main."
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore /warnaserror

      - name: Test (unit only — Docker suites run in CI workflow)
        run: |
          dotnet test -c Release --no-build \
            --filter "FullyQualifiedName!~IntegrationTests&FullyQualifiedName!~Sample.Tests" \
            --verbosity normal

      - name: AOT publish verify
        run: |
          # AOT loop must exclude projects whose dependency closure is not AOT-safe:
          #  - Kun.Saga references Kun.EntityFrameworkCore (IsAotCandidate=false)
          #  - Kun.AspNetCore is IsAotCandidate=false (minimal-API generic helpers,
          #    see csproj comment). Mirrors ci.yml's aot-publish job.
          for proj in Kun.Core Kun.Mediator Kun.Validation Kun.EventBus Kun.EventBus.RabbitMQ Kun.Security Kun.Grpc Kun.Gateway; do
            if [ -d "src/$proj" ]; then
              echo "::group::AOT: $proj"
              dotnet publish "src/$proj" -c Release -r linux-x64 -p:PublishAot=true /warnaserror
              echo "::endgroup::"
            fi
          done

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Only -beta.N marks a prerelease; a -N patch tag is a full release
          # (same semantics as iclaw CalVer).
          if [[ "$GITHUB_REF_NAME" =~ -beta\. ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        run: |
          dotnet pack -c Release --no-build \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true \
            -o artifacts/

      - name: Push to NuGet.org
        run: |
          dotnet nuget push artifacts/*.nupkg \
            -k "${{ secrets.NUGET_API_KEY }}" \
            -s https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push artifacts/*.snupkg \
            -k "${{ secrets.NUGET_API_KEY }}" \
            -s https://api.nuget.org/v3/index.json \
            --skip-duplicate || true

      - name: Push to GitHub Packages
        run: |
          dotnet nuget add source \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" || true
          dotnet nuget push artifacts/*.nupkg \
            -k "${{ secrets.GITHUB_TOKEN }}" \
            -s "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kun ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
